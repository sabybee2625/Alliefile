        <script>
            // Suppression robuste du badge Emergent (DOM + MutationObserver)
            (function () {
                function killBadge() {
                    var b = document.getElementById('emergent-badge');
                    if (b && b.parentNode) {
                        try { b.parentNode.removeChild(b); } catch (e) {}
                    }
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', killBadge);
                } else {
                    killBadge();
                }
                try {
                    var obs = new MutationObserver(killBadge);
                    obs.observe(document.documentElement, { childList: true, subtree: true });
                } catch (e) {}
            })();
        </script>
